<!DOCTYPE html>
<html>
<head>
    <title>Settings - Violation Configuration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #181c23;
            color: #f8f9fa;
            min-height: 100vh;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #232733;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0;
            border-right: 1px solid #232733;
        }
        .sidebar .nav-link {
            color: #bfc7d5;
            font-weight: 500;
            padding: 1.1rem 1.5rem;
            border-radius: 0;
            transition: background 0.2s;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            background: #2d3342;
            color: #fff;
        }
        .sidebar .sidebar-header {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 2rem 1.5rem 1rem 1.5rem;
            letter-spacing: 1px;
            color: #ff9800;
            border-bottom: 1px solid #232733;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .header-bar {
            background: #232733;
            padding: 1rem 2rem;
            border-bottom: 1px solid #232733;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-bar h1 {
            color: #ff9800;
            font-size: 1.6rem;
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .settings-section {
            background: #232733;
            border-radius: 16px;
            margin: 2rem 2rem 2rem 2rem;
            padding: 2rem 2rem 1.5rem 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.7);
            max-width: 600px;
        }
        .settings-section h2 {
            color: #ff9800;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1.2rem;
        }
        .form-label, .form-select, .form-control, .badge, .btn {
            font-size: 1rem;
        }
        .badge.bg-info {
            background: #17a2b8 !important;
            color: #181c23 !important;
        }
        .badge.bg-secondary {
            background: #444 !important;
            color: #fff !important;
        }
        
        /* Zone Selector Improvements */
        .zone-canvas-container {
            position: relative;
            display: inline-block;
            cursor: crosshair;
        }
        .zone-canvas-container canvas {
            cursor: crosshair;
        }
        .zone-coords-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #0ff;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .zone-magnifier {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px solid #0ff;
            border-radius: 50%;
            pointer-events: none;
            overflow: hidden;
            display: none;
            z-index: 15;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        .zone-magnifier canvas {
            position: absolute;
        }
        .zone-point-list {
            max-height: 150px;
            overflow-y: auto;
            background: #1a1e25;
            border-radius: 4px;
            padding: 8px;
            margin-top: 10px;
        }
        .zone-point-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #333;
            font-family: monospace;
            font-size: 13px;
        }
        .zone-point-item:last-child {
            border-bottom: none;
        }
        .zone-point-item .point-num {
            color: #ff9800;
            font-weight: bold;
            margin-right: 10px;
        }
        .zone-point-item .point-coords {
            color: #0ff;
        }
        .zone-point-item .btn-remove-point {
            padding: 2px 6px;
            font-size: 10px;
        }
        .zone-help-text {
            background: #1a1e25;
            border-left: 3px solid #ff9800;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .zone-help-text kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        .zone-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .zone-toolbar .btn {
            font-size: 13px;
            padding: 5px 12px;
        }
        .zone-resolution-info {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        
        /* Large screens (1400px+) */
        @media (min-width: 1400px) {
            .settings-section {
                max-width: 800px;
                margin: 3rem auto;
                padding: 3rem;
            }
            .settings-section h2 {
                font-size: 1.4rem;
                margin-bottom: 1.5rem;
            }
            .form-label {
                font-size: 1.1rem;
            }
            .form-select, .form-control {
                font-size: 1.05rem;
                padding: 0.7rem 1rem;
            }
            .btn {
                font-size: 1.05rem;
                padding: 0.6rem 2rem;
            }
        }
        /* Tablets and medium screens */
        @media (max-width: 1200px) {
            .settings-section {
                max-width: 700px;
                margin: 2rem auto;
            }
        }
        /* Tablets (768px - 900px) */
        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                border-right: none;
                border-bottom: 1px solid #232733;
                padding: 0;
                min-height: auto;
            }
            .sidebar .sidebar-header {
                padding: 0.8rem 1.5rem;
                border-bottom: none;
                border-right: 1px solid #232733;
                font-size: 1.3rem;
            }
            .sidebar .nav-link {
                padding: 0.8rem 1.2rem;
                font-size: 0.95rem;
            }
            .main-content {
                min-width: 100%;
            }
            .header-bar {
                padding: 1rem 1.5rem;
            }
            .header-bar h1 {
                font-size: 1.4rem;
            }
            .settings-section {
                max-width: 600px;
                margin: 1.5rem auto;
                padding: 1.5rem;
            }
            .settings-section h2 {
                font-size: 1.1rem;
            }
        }
        /* Mobile (600px and below) */
        @media (max-width: 600px) {
            .dashboard-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: flex-start;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid #232733;
            }
            .sidebar .sidebar-header {
                padding: 0.6rem 1rem;
                border-bottom: none;
                border-right: 1px solid #232733;
                font-size: 1.1rem;
                white-space: nowrap;
            }
            .sidebar .nav-link {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            .main-content {
                padding: 0;
            }
            .header-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 0.8rem 1rem;
                gap: 0.5rem;
            }
            .header-bar h1 {
                font-size: 1.2rem;
            }
            .settings-section {
                max-width: 100%;
                margin: 0.5rem;
                padding: 1rem;
                border-radius: 12px;
            }
            .settings-section h2 {
                font-size: 1rem;
                margin-bottom: 1rem;
            }
            .form-label {
                font-size: 0.95rem;
                margin-bottom: 0.4rem;
            }
            .form-select, .form-control {
                font-size: 0.95rem;
                padding: 0.5rem 0.8rem;
            }
            .btn {
                font-size: 0.9rem;
                padding: 0.5rem 1rem;
                width: 100%;
                margin-bottom: 0.5rem;
            }
            .btn + .btn {
                margin-top: 0;
            }
            small {
                font-size: 0.8rem;
            }
        }
        /* Extra small (480px and below) */
        @media (max-width: 480px) {
            .sidebar .sidebar-header {
                font-size: 0.95rem;
                padding: 0.5rem 0.7rem;
            }
            .sidebar .nav-link {
                padding: 0.5rem 0.6rem;
                font-size: 0.8rem;
            }
            .header-bar {
                padding: 0.6rem 0.8rem;
            }
            .header-bar h1 {
                font-size: 1.1rem;
            }
            .settings-section {
                margin: 0.3rem;
                padding: 0.8rem;
            }
            .form-label {
                font-size: 0.9rem;
            }
            .form-select, .form-control {
                font-size: 0.9rem;
                padding: 0.4rem 0.6rem;
            }
            .badge {
                font-size: 0.85rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <nav class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-camera-video-fill"></i> CCTV Monitor
        </div>
        <a class="nav-link" href="/"><i class="bi bi-house-door-fill"></i> Home</a>
        <a class="nav-link" href="/violations"><i class="bi bi-exclamation-triangle-fill"></i> Violations</a>
        <a class="nav-link active" href="/settings"><i class="bi bi-gear-fill"></i> Settings</a>
    </nav>
    <div class="main-content">
        <div class="header-bar">
            <h1><i class="bi bi-gear-fill"></i> Configuration Settings</h1>
        </div>
        <div class="settings-section mx-auto">
            <form id="settingsForm">
                <div class="mb-3">
                    <label for="violation_time" class="form-label">Violation Time Threshold (seconds)</label>
                    <input type="number" class="form-control" id="violation_time" name="violation_time" min="1" required>
                    <small class="text-muted">Time before a parked vehicle is flagged as a violation</small>
                </div>
                <div class="mb-3">
                    <label for="repeat_capture" class="form-label">Repeat Capture Interval (seconds)</label>
                    <input type="number" class="form-control" id="repeat_capture" name="repeat_capture" min="1" required>
                    <small class="text-muted">Cooldown between logging the same vehicle</small>
                </div>
                <div class="mb-3">
                    <label for="cameraSelect" class="form-label">Select Camera</label>
                    <select class="form-select" id="cameraSelect" name="cameraSelect">
                        <option value="Camera_1">Camera 1</option>
                        <option value="Camera_2">Camera 2</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
                <a href="/" class="btn btn-secondary">Back to Home</a>
            </form>
            <div id="status" class="mt-3"></div>
            <div id="dbStatus" class="mt-2 small text-muted"></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let piPublicUrl = "";
    let currentSettings = {};

    // Fetch Pi public URL on load
    function fetchPiUrl() {
        return fetch('/api/get_pi_url')
            .then(r => r.json())
            .then(data => {
                piPublicUrl = data.public_url || "";
            });
    }

    function injectSettingsToForm(data) {
        currentSettings = data;
        document.getElementById('violation_time').value = data.VIOLATION_TIME_THRESHOLD || 100;
        document.getElementById('repeat_capture').value = data.REPEAT_CAPTURE_INTERVAL || 60;
    }

    function loadSettings() {
        fetch('/api/settings')
            .then(async r => {
                if (!r.ok) {
                    throw new Error("HTTP " + r.status + " " + r.statusText);
                }
                let text = await r.text();
                let data;
                try {
                    data = JSON.parse(text);
                    injectSettingsToForm(data);
                    return;
                } catch (err) {
                    document.getElementById('status').innerHTML =
                        '<div class="alert alert-danger">Failed to parse settings JSON.<br><small>' +
                        text.replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                        '</small></div>';
                    console.error("Failed to parse JSON from /api/settings:", text);
                    throw err;
                }
            })
            .catch((err) => {
                document.getElementById('status').innerHTML =
                    '<div class="alert alert-warning">Could not load settings from Pi. Using defaults.<br><small>' +
                    (err && err.message ? err.message : err) +
                    '</small></div>';
                console.error("Failed to load settings:", err);
                document.getElementById('violation_time').value = 100;
                document.getElementById('repeat_capture').value = 60;
            });
    }

    function loadDbStatus() {
        fetch('/api/db_settings')
            .then(r => r.json())
            .then(data => {
                if (data.VIOLATION_TIME_THRESHOLD !== undefined) {
                    document.getElementById('dbStatus').innerHTML = 
                        '<i class="bi bi-database-check text-success"></i> Database: ' +
                        'Violation=' + data.VIOLATION_TIME_THRESHOLD + 's, ' +
                        'Repeat=' + data.REPEAT_CAPTURE_INTERVAL + 's';
                }
            })
            .catch(() => {
                document.getElementById('dbStatus').innerHTML = 
                    '<i class="bi bi-database-x text-warning"></i> Database unavailable';
            });
    }

    document.addEventListener('DOMContentLoaded', function() {
        fetchPiUrl().then(() => {
            loadSettings();
            loadDbStatus();
        });
    });

    document.getElementById('cameraSelect').addEventListener('change', function() {
        // Camera selector kept for user choice; no zone logic
    });

    document.getElementById('settingsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const status = document.getElementById('status');

        const violationTime = parseInt(document.getElementById('violation_time').value);
        const repeatCapture = parseInt(document.getElementById('repeat_capture').value);

        if (isNaN(violationTime) || violationTime < 1) {
            status.innerHTML = '<div class="alert alert-danger">Please enter a valid Violation Time Threshold (minimum 1 second)</div>';
            return;
        }
        if (isNaN(repeatCapture) || repeatCapture < 1) {
            status.innerHTML = '<div class="alert alert-danger">Please enter a valid Repeat Capture Interval (minimum 1 second)</div>';
            return;
        }

        let body = {
            VIOLATION_TIME_THRESHOLD: violationTime,
            REPEAT_CAPTURE_INTERVAL: repeatCapture
        };

        status.innerHTML = '<div class="alert alert-info"><i class="bi bi-hourglass-split"></i> Saving settings to database and syncing to Pi...</div>';

        fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                status.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle"></i> Settings saved to database and synced to Pi!</div>';
                setTimeout(() => {
                    loadSettings();
                    loadDbStatus();
                    status.innerHTML = '';
                }, 1500);
            } else {
                status.innerHTML = '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> Error saving settings: ' + (result.error || 'Unknown error') + '</div>';
            }
        })
        .catch(err => {
            status.innerHTML = '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> Error saving settings: ' + (err.message || err) + '</div>';
        });
    });
</script>
</body>
</html>
