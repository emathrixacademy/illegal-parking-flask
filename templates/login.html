<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#352070">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DECONGESTILAGUNA">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
  <title>Login — DECONGESTILAGUNA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #f0f2f7;
      color: #1a1a2e;
      font-family: 'Inter', 'Segoe UI', 'Roboto', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 1rem;
      -webkit-tap-highlight-color: transparent;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      border: 1px solid #e5e7eb;
    }
    .login-card h4 { margin-bottom: 0.3rem; color: #352070; font-weight: 700; font-size: 1.3rem; }
    .login-card .subtitle { color: #6b7280; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #352070;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    .login-logo i { font-size: 1.6rem; color: #fff; }
    .form-control {
      background: #fff;
      color: #1a1a2e;
      border: 1px solid #e5e7eb;
      font-size: 0.9rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
    }
    .form-control:focus {
      background: #fff;
      color: #1a1a2e;
      border-color: #6c3ec7;
      box-shadow: 0 0 0 0.15rem rgba(108,62,199,0.15);
    }
    .form-label { font-size: 0.82rem; color: #6b7280; font-weight: 500; }
    .btn-login {
      background: #352070;
      border-color: #352070;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.65rem;
      border-radius: 8px;
    }
    .btn-login:hover { background: #281860; border-color: #281860; color: #fff; }
    .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.85rem; border-radius: 8px; }
    @media (min-width: 768px) {
      .login-card { padding: 3rem 2.5rem; }
      .login-card h4 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="login-card text-center">
    <div class="login-logo"><i class="bi bi-camera-video-fill"></i></div>
    <h4>DECONGESTILAGUNA</h4>
    <p class="subtitle">Illegal Parking Detection System</p>
    {% if error %}
    <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}
    <form method="POST" class="text-start">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person"></i> Username</label>
        <input name="username" type="text" class="form-control" required autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-lock"></i> Password</label>
        <input name="password" type="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-login w-100 mt-1"><i class="bi bi-box-arrow-in-right"></i> Login</button>
    </form>
  </div>
  <script>
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
  </script>
</body>
</html>
