<!DOCTYPE html>
<html>
<head>
    <title>Violators - Illegal Parking Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #181c23;
            color: #f8f9fa;
            min-height: 100vh;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #232733;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0;
            border-right: 1px solid #232733;
        }
        .sidebar .nav-link {
            color: #bfc7d5;
            font-weight: 500;
            padding: 1.1rem 1.5rem;
            border-radius: 0;
            transition: background 0.2s;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            background: #2d3342;
            color: #fff;
        }
        .sidebar .sidebar-header {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 2rem 1.5rem 1rem 1.5rem;
            letter-spacing: 1px;
            color: #ff9800;
            border-bottom: 1px solid #232733;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .header-bar {
            background: #232733;
            padding: 1rem 2rem;
            border-bottom: 1px solid #232733;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-bar h1 {
            color: #ff9800;
            font-size: 1.6rem;
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .violations-section {
            background: #232733;
            border-radius: 16px;
            margin: 2rem 2rem 2rem 2rem;
            padding: 2rem 2rem 1.5rem 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.7);
            max-width: 800px;
        }
        .violations-section h2 {
            color: #ff9800;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1.2rem;
        }
        .violation-timeline {
            border-left: 3px solid #ff9800;
            margin-left: 1.2rem;
            padding-left: 1.5rem;
        }
        .violation-card {
            background: #181c23;
            border: 1px solid #2d3342;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            box-shadow: 0 2px 8px #0004;
        }
        .violation-card img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px 0 0 10px;
            border-right: 2px solid #232733;
            background: #222;
        }
        .violation-card-body {
            padding: 0.8rem 1rem;
            flex: 1;
        }
        .violation-card-title {
            color: #ff9800;
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
        }
        .violation-card-meta {
            color: #bfc7d5;
            font-size: 0.92rem;
            margin-bottom: 0.5rem;
        }
        .violation-card pre {
            background: #232733;
            color: #bfc7d5;
            font-size: 0.92em;
            border: none;
            margin: 0;
            padding: 0.3rem 0.5rem;
        }
        /* Large screens (1400px+) */
        @media (min-width: 1400px) {
            .violations-section {
                max-width: 1200px;
                margin: 3rem auto;
                padding: 3rem;
            }
            .violations-section h2 {
                font-size: 1.4rem;
                margin-bottom: 1.5rem;
            }
            .violation-timeline {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
                gap: 2rem;
            }
            .violation-card {
                flex-direction: column;
            }
            .violation-card img {
                width: 100%;
                height: 180px;
                border-radius: 10px 10px 0 0;
                border-right: none;
                border-bottom: 2px solid #232733;
            }
        }
        /* Ultra-wide screens (1800px+) */
        @media (min-width: 1800px) {
            .violations-section {
                max-width: 100%;
                padding: 3rem;
            }
            .violation-timeline {
                grid-template-columns: repeat(5, 1fr);
                gap: 2.5rem;
            }
        }
        /* Tablets and medium screens */
        @media (max-width: 1200px) {
            .violations-section {
                max-width: 900px;
                margin: 2rem auto;
            }
            .violation-timeline {
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 1.5rem;
            }
        }
        /* Tablets (768px - 900px) */
        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                border-right: none;
                border-bottom: 1px solid #232733;
                padding: 0;
            }
            .sidebar .sidebar-header {
                padding: 0.8rem 1.5rem;
                border-bottom: none;
                border-right: 1px solid #232733;
                font-size: 1.3rem;
            }
            .sidebar .nav-link {
                padding: 0.8rem 1.2rem;
                font-size: 0.95rem;
            }
            .main-content {
                min-width: 100%;
            }
            .header-bar {
                padding: 1rem 1.5rem;
            }
            .header-bar h1 {
                font-size: 1.4rem;
            }
            .violations-section {
                max-width: 100%;
                margin: 1.5rem;
                padding: 1.5rem;
            }
            .violations-section h2 {
                font-size: 1.1rem;
            }
            .violation-timeline {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 1rem;
            }
            .violation-card {
                flex-direction: row;
            }
            .violation-card img {
                width: 120px;
                height: 80px;
                border-radius: 10px 0 0 10px;
                border-right: 2px solid #232733;
                border-bottom: none;
            }
        }
        /* Mobile (600px and below) */
        @media (max-width: 600px) {
            .dashboard-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: flex-start;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid #232733;
            }
            .sidebar .sidebar-header {
                padding: 0.6rem 1rem;
                border-bottom: none;
                border-right: 1px solid #232733;
                font-size: 1.1rem;
                white-space: nowrap;
            }
            .sidebar .nav-link {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            .main-content {
                padding: 0;
            }
            .header-bar {
                padding: 0.8rem 1rem;
                flex-direction: column;
                align-items: flex-start;
            }
            .header-bar h1 {
                font-size: 1.2rem;
            }
            .violations-section {
                max-width: 100%;
                margin: 0.5rem;
                padding: 1rem;
                border-radius: 12px;
            }
            .violations-section h2 {
                font-size: 1rem;
                margin-bottom: 1rem;
            }
            .violation-timeline {
                display: grid;
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .violation-card {
                flex-direction: row;
                border-radius: 8px;
            }
            .violation-card img {
                width: 100px;
                height: 70px;
                border-radius: 8px 0 0 8px;
            }
            .violation-card-body {
                padding: 0.6rem 0.8rem;
            }
            .violation-card-title {
                font-size: 0.95rem;
            }
            .violation-card-meta {
                font-size: 0.85rem;
            }
            .violation-card pre {
                font-size: 0.85em;
                padding: 0.2rem 0.4rem;
            }
        }
        /* Extra small (480px and below) */
        @media (max-width: 480px) {
            .sidebar .sidebar-header {
                font-size: 0.95rem;
                padding: 0.5rem 0.7rem;
            }
            .sidebar .nav-link {
                padding: 0.5rem 0.6rem;
                font-size: 0.8rem;
            }
            .header-bar {
                padding: 0.6rem 0.8rem;
            }
            .header-bar h1 {
                font-size: 1.1rem;
            }
            .violations-section {
                margin: 0.3rem;
                padding: 0.8rem;
            }
            .violation-card {
                flex-direction: column;
                border-radius: 8px;
            }
            .violation-card img {
                width: 100%;
                height: 100px;
                border-radius: 8px 8px 0 0;
                border-right: none;
                border-bottom: 2px solid #232733;
            }
            .violation-card-body {
                padding: 0.6rem;
            }
            .violation-card-title {
                font-size: 0.9rem;
            }
            .violation-card-meta {
                font-size: 0.8rem;
            }
            .violation-card pre {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <nav class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-camera-video-fill"></i> CCTV Monitor
        </div>
        <a class="nav-link" href="/"><i class="bi bi-house-door-fill"></i> Home</a>
        <a class="nav-link active" href="/violations"><i class="bi bi-exclamation-triangle-fill"></i> Violations</a>
        <a class="nav-link" href="/settings"><i class="bi bi-gear-fill"></i> Settings</a>
    </nav>
    <div class="main-content">
        <div class="header-bar">
            <h1><i class="bi bi-exclamation-triangle-fill"></i> Violators</h1>
        </div>
        <div class="violations-section mx-auto">
            <h2><i class="bi bi-exclamation-triangle-fill"></i> Parking Violations</h2>
            <div class="mb-3">
                <label for="sortSelect" class="form-label">Sort by:</label>
                <select id="sortSelect" class="form-select" style="max-width:250px;display:inline-block;">
                    <option value="desc">Newest First</option>
                    <option value="asc">Oldest First</option>
                    <option value="month">Group by Month</option>
                    <option value="date">Group by Date</option>
                    <option value="hour">Group by Hour</option>
                </select>
            </div>
            <div id="violationEvents" class="violation-timeline"></div>
            <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
        </div>
        <!-- Modal for image zoom -->
        <div class="modal fade" id="zoomModal" tabindex="-1" aria-labelledby="zoomModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark">
              <div class="modal-header border-0">
                <h5 class="modal-title text-warning" id="zoomModalLabel">Violation Image</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body text-center">
                <img id="zoomedImage" src="" alt="Zoomed Violation" style="max-width:100%;max-height:70vh;border-radius:10px;">
              </div>
            </div>
          </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function groupBy(arr, keyFn) {
    return arr.reduce((acc, item) => {
        const key = keyFn(item);
        if (!acc[key]) acc[key] = [];
        acc[key].push(item);
        return acc;
    }, {});
}

function formatMonth(ts) {
    const d = new Date(ts);
    return d.toLocaleString('default', { month: 'long', year: 'numeric' });
}
function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString();
}
function formatHour(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString() + ' ' + d.getHours() + ':00';
}

function renderViolations(events, sortType) {
    const container = document.getElementById('violationEvents');
    if (!events.length) {
        container.innerHTML = "<div class='alert alert-info'>No violations detected.</div>";
        return;
    }
    let html = "";
    if (sortType === "month") {
        const grouped = groupBy(events, ev => formatMonth(ev.timestamp));
        Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a)).forEach(month => {
            html += `<h5 class="mt-4 mb-2 text-warning">${month}</h5>`;
            html += grouped[month].map(ev => violationCard(ev)).join('');
        });
    } else if (sortType === "date") {
        const grouped = groupBy(events, ev => formatDate(ev.timestamp));
        Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
            html += `<h6 class="mt-3 mb-2 text-info">${date}</h6>`;
            html += grouped[date].map(ev => violationCard(ev)).join('');
        });
    } else if (sortType === "hour") {
        const grouped = groupBy(events, ev => formatHour(ev.timestamp));
        Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a)).forEach(hour => {
            html += `<div class="mt-3 mb-2 text-secondary fw-bold">${hour}</div>`;
            html += grouped[hour].map(ev => violationCard(ev)).join('');
        });
    } else {
        // Default: sort by timestamp
        events.sort((a, b) => sortType === "asc"
            ? new Date(a.timestamp) - new Date(b.timestamp)
            : new Date(b.timestamp) - new Date(a.timestamp));
        html = events.map(ev => violationCard(ev)).join('');
    }
    container.innerHTML = html;
}

function violationCard(ev) {
    let label = ev.meta && ev.meta.label ? ev.meta.label : (ev.label || "");
    let tracker_id = ev.meta && ev.meta.tracker_id ? ev.meta.tracker_id : (ev.tracker_id || "");
    let imgSrc = ev.proxy_image_url || ev.local_image_url || ev.image_url;
    let fallbackSrc = ev.local_image_url || ev.image_url || '';
    // Add data-img for zoom, and onerror fallback
    return `
    <div class="violation-card">
        <img src="${imgSrc}" alt="Violation"
            data-img="${imgSrc}"
            onerror="if(this.src!==location.origin+'${fallbackSrc}' && '${fallbackSrc}')this.src='${fallbackSrc}';"
            style="cursor:zoom-in"
            onclick="showZoomModal(this)">
        <div class="violation-card-body">
            <div class="violation-card-title">
                <i class="bi bi-camera-video"></i> ${ev.camera_id}
                ${label ? `<span class="badge bg-warning text-dark ms-2">${label}</span>` : ""}
                ${tracker_id !== "" ? `<span class="badge bg-info text-dark ms-2">#${tracker_id}</span>` : ""}
            </div>
            <div class="violation-card-meta">
                <i class="bi bi-clock"></i> ${ev.timestamp}
            </div>
            ${ev.meta && Object.keys(ev.meta).length ? `<pre>${JSON.stringify(ev.meta,null,2)}</pre>` : ""}
        </div>
    </div>
    `;
}

let allEvents = [];
async function loadViolationEvents(){
    try{
        const res = await fetch('/api/events');
        allEvents = await res.json();
        renderViolations(allEvents, document.getElementById('sortSelect').value);
    }catch{
        document.getElementById('violationEvents').innerHTML="<div class='alert alert-danger'>Failed to load events.</div>";
    }
}
document.getElementById('sortSelect').addEventListener('change', function(){
    renderViolations(allEvents, this.value);
});
window.onload = loadViolationEvents;

// Image zoom modal logic
function showZoomModal(imgElem) {
    const zoomedImage = document.getElementById('zoomedImage');
    zoomedImage.src = imgElem.getAttribute('data-img') || imgElem.src;
    const modal = new bootstrap.Modal(document.getElementById('zoomModal'));
    modal.show();
}
</script>
</body>
</html>
