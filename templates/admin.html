<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Illegal Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#121216; color:#fff; font-family:Segoe UI, Roboto, Arial; }
    .card { background:#1f2228; border-radius:12px; }
    textarea { font-family:monospace; color:#0f1720; }
    table { color: #fff; }
    .small-muted { color: #aaa; font-size: 0.9em; }
      </style>
    </head>
    <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Admin</h3>
        <a class="btn btn-outline-light" href="/">Back</a>
      </div>

      <div class="card p-3 mb-3">
        <h5>Database Settings (read / write)</h5>
        <p class="small-muted">These are the raw settings stored in the config table. Edit JSON then click Save.</p>
        <div class="mb-2">
          <textarea id="settingsJson" rows="8" class="form-control"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button id="saveBtn" class="btn btn-primary">Save</button>
          <button id="reloadBtn" class="btn btn-secondary">Reload</button>
          <div id="status" class="align-self-center text-success small"></div>
        </div>
      </div>

      <div class="card p-3 mb-3">
        <h5>Actions</h5>
        <div class="mt-2 d-flex gap-2">
          <button id="syncBtn" class="btn btn-warning">Trigger Sync (Pi server)</button>
          <button id="clearEventsBtn" class="btn btn-danger">Clear Local Events Table</button>
          <div id="actionMsg" class="align-self-center small-muted"></div>
        </div>
      </div>

      <div class="card p-3">
        <h5>Violations</h5>
        <p class="small-muted">List of violation records from the local DB. Select rows and mark them enforced.</p>
        <div class="table-responsive">
          <table id="violationsTable" class="table table-sm table-dark table-striped">
            <thead>
              <tr>
                <th><input id="selectAll" type="checkbox"></th>
                <th>ID</th>
                <th>Camera</th>
                <th>Label</th>
                <th>Timestamp</th>
                <th>Image</th>
                <th>Barangay</th>
                <th>Enforced</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="d-flex gap-2">
          <button id="enforceBtn" class="btn btn-success">Mark Selected Enforced</button>
          <button id="refreshViolations" class="btn btn-secondary">Refresh</button>
          <div id="violationsMsg" class="align-self-center small-muted"></div>
        </div>
      </div>

    </div>

    <script>
    // Settings functions
    async function fetchSettings(){
      document.getElementById('status').textContent = '';
      try{
        const r = await fetch('/api/db_settings');
        const data = await r.json();
        document.getElementById('settingsJson').value = JSON.stringify(data, null, 2);
      }catch(e){
        document.getElementById('settingsJson').value = '{\n  "error": "failed to fetch"\n}';
      }
    }

    async function saveSettings(){
      const txt = document.getElementById('settingsJson').value;
      try{
        const payload = JSON.parse(txt);
        const r = await fetch('/api/db_settings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        if(r.ok){
          document.getElementById('status').textContent = 'Saved';
          setTimeout(()=>document.getElementById('status').textContent='',1500);
        }else{
          document.getElementById('status').textContent = 'Save failed';
        }
      }catch(e){
        document.getElementById('status').textContent = 'Invalid JSON';
      }
    }

    // Violations functions
    async function fetchViolations(){
      const tbody = document.querySelector('#violationsTable tbody');
      tbody.innerHTML = '';
      document.getElementById('violationsMsg').textContent = '';
      try{
        const r = await fetch('/api/violations_list');
        const rows = await r.json();
        for(const row of rows){
          const tr = document.createElement('tr');
          const checked = row.enforced ? 'checked' : '';
          tr.innerHTML = `
            <td><input class="rowChk" data-id="${row.id}" type="checkbox" ${row.enforced ? 'disabled' : ''}></td>
            <td>${row.id}</td>
            <td>${row.camera || ''}</td>
            <td>${row.label || ''}</td>
            <td>${row.timestamp || ''}</td>
            <td>${row.image_path ? '<a target="_blank" href="/api/image_from_db?image_path='+encodeURIComponent(row.image_path)+'">view</a>' : ''}</td>
            <td>${row.barangay || ''}</td>
            <td>${row.enforced ? 'Yes' : 'No'}</td>
          `;
          tbody.appendChild(tr);
        }
      }catch(e){
        document.getElementById('violationsMsg').textContent = 'Failed to load violations';
      }
    }

    async function markSelectedEnforced(){
      const checks = Array.from(document.querySelectorAll('.rowChk')).filter(c=>c.checked && !c.disabled);
      if(!checks.length){ document.getElementById('violationsMsg').textContent = 'No rows selected'; return; }
      const ids = checks.map(c=>parseInt(c.dataset.id,10));
      try{
        const r = await fetch('/api/mark_enforced', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids})});
        if(r.ok){
          document.getElementById('violationsMsg').textContent = 'Marked enforced';
          setTimeout(()=>document.getElementById('violationsMsg').textContent='',1500);
          fetchViolations();
        }else{
          document.getElementById('violationsMsg').textContent = 'Failed to mark enforced';
        }
      }catch(e){ document.getElementById('violationsMsg').textContent = 'Error during request'; }
    }

    document.getElementById('saveBtn').addEventListener('click', saveSettings);
    document.getElementById('reloadBtn').addEventListener('click', fetchSettings);
    document.getElementById('syncBtn').addEventListener('click', async ()=>{
      try{ const r = await fetch('/api/sync_from_railway', {method:'POST'}); document.getElementById('actionMsg').textContent = r.ok ? 'Sync triggered' : 'Sync failed'; }catch(e){document.getElementById('actionMsg').textContent='Sync error';}
    });
    document.getElementById('clearEventsBtn').addEventListener('click', async ()=>{
      try{ const r = await fetch('/api/clear_events', {method:'POST'}); document.getElementById('actionMsg').textContent = r.ok ? 'Cleared' : 'Clear failed'; }catch(e){document.getElementById('actionMsg').textContent='Clear error';}
    });
    document.getElementById('enforceBtn').addEventListener('click', markSelectedEnforced);
    document.getElementById('refreshViolations').addEventListener('click', fetchViolations);
    document.getElementById('selectAll').addEventListener('change', function(){
      const chks = document.querySelectorAll('.rowChk'); chks.forEach(c=>{ if(!c.disabled) c.checked = this.checked; });
    });

    // Load initial data
    fetchSettings();
    fetchViolations();
    </script>
    </body>
    </html>
