<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Illegal Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#121216; color:#fff; font-family:Segoe UI, Roboto, Arial; }
    .card { background:#1f2228; border-radius:12px; }
    textarea { font-family:monospace; color:#0f1720; }
    table { color: #fff; }
    .small-muted { color: #aaa; font-size: 0.9em; }
      /* Responsive overrides for modern mobile devices */
      @media (max-width:1200px){
        .card, .container { padding: 0.75rem; }
      }
      @media (max-width:900px){
        body{font-size:14px}
        .card{padding:0.8rem}
        .table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch}
        table.table td, table.table th{font-size:0.85rem}
        .d-flex.gap-2{flex-direction:column;align-items:stretch}
      }
      @media (max-width:480px){
        h3{font-size:1.05rem}
        .card{border-radius:10px;padding:0.6rem}
        .small-muted{font-size:0.82rem}
      }
      </style>
    </head>
    <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Admin</h3>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light" href="/">Back</a>
          <a class="btn btn-outline-primary" href="/settings">Settings</a>
        </div>
      </div>

      <div class="card p-3">
        <h5>Violations</h5>
        <p class="small-muted">List of violation records from the Database. Select rows and mark them enforced.</p>
        <div class="table-responsive">
          <table id="violationsTable" class="table table-sm table-dark table-striped">
            <thead>
              <tr>
                <th><input id="selectAll" type="checkbox"></th>
                <th>ID</th>
                <th>Camera</th>
                <th>Tracker</th>
                <th>Label</th>
                <th>Timestamp</th>
                <th>Confidence</th>
                <th>Duration (min)</th>
                <th>Fine</th>
                <th>Image</th>
                <th>Barangay</th>
                <th>Enforced</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="d-flex gap-2">
          <button id="enforceBtn" class="btn btn-success">Mark Selected Enforced</button>
          <button id="refreshViolations" class="btn btn-secondary">Refresh</button>
          <div id="violationsMsg" class="align-self-center small-muted"></div>
        </div>
      </div>

      <div class="card p-3 mt-3">
        <h5>Fines</h5>
        <p class="small-muted">Update fine amounts for vehicle types (in pesos).</p>
        <div class="row g-2">
          <div class="col-6 col-md-3">
            <label class="form-label fw-bold text-white">CAR</label>
            <div class="input-group">
              <span class="input-group-text">₱</span>
              <input id="fine_car" type="number" class="form-control" step="0.01" placeholder="e.g. 100">
            </div>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label fw-bold text-white">MOTORCYCLE</label>
            <div class="input-group">
              <span class="input-group-text">₱</span>
              <input id="fine_motorcycle" type="number" class="form-control" step="0.01" placeholder="e.g. 50">
            </div>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label fw-bold text-white">TRUCK</label>
            <div class="input-group">
              <span class="input-group-text">₱</span>
              <input id="fine_truck" type="number" class="form-control" step="0.01" placeholder="e.g. 200">
            </div>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label fw-bold text-white">BUS</label>
            <div class="input-group">
              <span class="input-group-text">₱</span>
              <input id="fine_bus" type="number" class="form-control" step="0.01" placeholder="e.g. 250">
            </div>
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button id="saveFines" class="btn btn-primary">Save Fines</button>
          <button id="refreshFines" class="btn btn-secondary">Refresh</button>
          <div id="finesMsg" class="align-self-center small-muted"></div>
        </div>
      </div>

    </div>

    <script>
    // Violations functions
    async function fetchViolations(){
      const tbody = document.querySelector('#violationsTable tbody');
      tbody.innerHTML = '';
      document.getElementById('violationsMsg').textContent = '';
      try{
        const r = await fetch('/api/violations_list');
        const rows = await r.json();
        for(const row of rows){
          const tr = document.createElement('tr');
          const disabled = row.enforced ? 'disabled' : '';
          tr.innerHTML = `
            <td><input class="rowChk" data-id="${row.id}" type="checkbox" ${disabled}></td>
            <td>${row.id}</td>
            <td>${row.camera || ''}</td>
            <td>${row.tracker_id ?? ''}</td>
            <td>${row.label || ''}</td>
            <td>${row.timestamp || ''}</td>
            <td>${row.confidence_score !== undefined && row.confidence_score !== null ? Number(row.confidence_score).toFixed(3) : ''}</td>
            <td>${row.duration_minutes !== undefined && row.duration_minutes !== null ? Number(row.duration_minutes).toFixed(1) : ''}</td>
            <td>${row.fine_amount !== undefined && row.fine_amount !== null ? Number(row.fine_amount).toFixed(2) : ''}</td>
            <td>${row.image_path ? '<a target="_blank" href="/api/image_from_db?image_path='+encodeURIComponent(row.image_path)+'">view</a>' : ''}</td>
            <td>${row.barangay || ''}</td>
            <td>${row.enforced ? 'Yes' : 'No'}</td>
          `;
          tbody.appendChild(tr);
        }
      }catch(e){
        document.getElementById('violationsMsg').textContent = 'Failed to load violations';
      }
    }

    async function markSelectedEnforced(){
      const checks = Array.from(document.querySelectorAll('.rowChk')).filter(c=>c.checked && !c.disabled);
      if(!checks.length){ document.getElementById('violationsMsg').textContent = 'No rows selected'; return; }
      const ids = checks.map(c=>parseInt(c.dataset.id,10));
      try{
        const r = await fetch('/api/mark_enforced', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids})});
        if(r.ok){
          document.getElementById('violationsMsg').textContent = 'Marked enforced';
          setTimeout(()=>document.getElementById('violationsMsg').textContent='',1500);
          fetchViolations();
        }else{
          document.getElementById('violationsMsg').textContent = 'Failed to mark enforced';
        }
      }catch(e){ document.getElementById('violationsMsg').textContent = 'Error during request'; }
    }

    document.getElementById('enforceBtn').addEventListener('click', markSelectedEnforced);
    document.getElementById('refreshViolations').addEventListener('click', fetchViolations);
    document.getElementById('selectAll').addEventListener('change', function(){
      const chks = document.querySelectorAll('.rowChk'); chks.forEach(c=>{ if(!c.disabled) c.checked = this.checked; });
    });

    // Load initial data
    fetchViolations();
    // Fines UI
    async function fetchFines(){
      document.getElementById('finesMsg').textContent = '';
      try{
        const r = await fetch('/api/fine_map');
        const j = await r.json();
        if(j && j.fine_map){
          const fm = j.fine_map;
          document.getElementById('fine_car').value = fm.CAR ?? fm.car ?? '';
          document.getElementById('fine_motorcycle').value = fm.MOTORCYCLE ?? fm.motorcycle ?? '';
          document.getElementById('fine_truck').value = fm.TRUCK ?? fm.truck ?? '';
          document.getElementById('fine_bus').value = fm.BUS ?? fm.bus ?? '';
        }
      }catch(e){ document.getElementById('finesMsg').textContent = 'Failed to load fines'; }
    }

    async function saveFines(){
      const car = parseFloat(document.getElementById('fine_car').value) || 0;
      const motorcycle = parseFloat(document.getElementById('fine_motorcycle').value) || 0;
      const truck = parseFloat(document.getElementById('fine_truck').value) || 0;
      const bus = parseFloat(document.getElementById('fine_bus').value) || 0;
      const payload = { fine_map: { CAR: car, MOTORCYCLE: motorcycle, TRUCK: truck, BUS: bus } };
      try{
        const r = await fetch('/api/set_fine_map', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
        const j = await r.json();
        if(r.ok && j.success){
          document.getElementById('finesMsg').textContent = 'Fines saved';
          setTimeout(()=>document.getElementById('finesMsg').textContent='',1500);
        }else{
          document.getElementById('finesMsg').textContent = 'Failed to save fines';
        }
      }catch(e){ document.getElementById('finesMsg').textContent = 'Error saving fines'; }
      fetchFines();
    }

    document.getElementById('saveFines').addEventListener('click', saveFines);
    document.getElementById('refreshFines').addEventListener('click', fetchFines);
    fetchFines();
    </script>
    </body>
    </html>
