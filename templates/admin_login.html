<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Admin Login — DECONGESTILAGUNA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #f0f2f7;
      color: #1a1a2e;
      font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 1rem;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 1.75rem 1.25rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }
    .login-card h4 { margin-bottom: 1.5rem; color: #352070; font-weight: 700; }
    .form-control {
      background: #fff;
      color: #1a1a2e;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.9rem;
      padding: 0.65rem 0.75rem;
    }
    .form-control:focus {
      background: #fff;
      color: #1a1a2e;
      border-color: #6c3ec7;
      box-shadow: 0 0 0 .15rem rgba(108,62,199,.15);
    }
    .form-label { color: #6b7280; font-size: 0.85rem; font-weight: 500; }
    .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.85rem; border-radius: 8px; }
    .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6b7280; cursor: pointer; font-size: 1rem; padding: 0.25rem; }
    @media (min-width: 480px) {
      .login-card { padding: 2.5rem 2rem; }
    }
    @media (min-width: 768px) {
      .login-card { padding: 3rem 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h4 class="text-center">Admin Login</h4>
    {% if error %}
    <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person"></i> Username</label>
        <input name="username" type="text" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-lock"></i> Password</label>
        <div style="position:relative;">
          <input name="password" id="adminPw" type="password" class="form-control" required style="padding-right:2.5rem;">
          <button type="button" class="pw-toggle" onclick="togglePw()"><i class="bi bi-eye" id="pwIcon"></i></button>
        </div>
      </div>
      <button type="submit" class="btn w-100" style="background:#352070;color:#fff;font-weight:600;border-radius:8px;">Login</button>
    </form>
    <div class="text-center mt-3">
      <a href="/dashboard" style="color:#6b7280;">Back to Home</a>
    </div>
  </div>
  <script>
  function togglePw(){const p=document.getElementById('adminPw'),i=document.getElementById('pwIcon');if(p.type==='password'){p.type='text';i.className='bi bi-eye-slash';}else{p.type='password';i.className='bi bi-eye';}}
  </script>
</body>
</html>
