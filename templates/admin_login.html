<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — DECONGESTILAGUNA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #f0f2f7;
      color: #1a1a2e;
      font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }
    .login-card h4 { margin-bottom: 1.5rem; color: #352070; font-weight: 700; }
    .form-control {
      background: #fff;
      color: #1a1a2e;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .form-control:focus {
      background: #fff;
      color: #1a1a2e;
      border-color: #6c3ec7;
      box-shadow: 0 0 0 .15rem rgba(108,62,199,.15);
    }
    .form-label { color: #6b7280; font-size: 0.85rem; font-weight: 500; }
    .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.85rem; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h4 class="text-center">Admin Login</h4>
    {% if error %}
    <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" type="text" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <button type="submit" class="btn w-100" style="background:#352070;color:#fff;font-weight:600;border-radius:8px;">Login</button>
    </form>
    <div class="text-center mt-3">
      <a href="/" style="color:#6b7280;">Back to Home</a>
    </div>
  </div>
</body>
</html>
