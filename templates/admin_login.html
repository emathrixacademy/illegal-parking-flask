<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — Illegal Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#121216; color:#fff; font-family:Segoe UI, Roboto, Arial; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .login-card { background:#1f2228; border-radius:12px; padding:2rem; width:100%; max-width:380px; }
    .login-card h4 { margin-bottom:1.5rem; }
    .form-control { background:#2a2d35; color:#fff; border:1px solid #444; }
    .form-control:focus { background:#2a2d35; color:#fff; border-color:#0d6efd; box-shadow:0 0 0 .2rem rgba(13,110,253,.25); }
    .alert-danger { background:#dc354520; border:1px solid #dc3545; color:#f88; }
  </style>
</head>
<body>
  <div class="login-card">
    <h4 class="text-center">Admin Login</h4>
    {% if error %}
    <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" type="text" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-center mt-3">
      <a href="/" class="text-secondary">Back to Home</a>
    </div>
  </div>
</body>
</html>
